<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Cost Minimum</title>
  <style>
    body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 16px;color:#17202a}
    textarea{width:100%;min-height:130px;box-sizing:border-box;padding:12px}
    button{margin-top:10px;padding:10px 18px;cursor:pointer}
    section{margin-top:24px;padding:16px;background:#f4f6f7;border-radius:8px}
    #error{color:#b03a2e} dt{font-weight:700;margin-top:8px} dd{margin-left:0}
  </style>
</head>
<body>
  <h1>Agent Cost Minimum</h1>
  <form id="form">
    <label for="prompt">Prompt</label>
    <textarea id="prompt" maxlength="10000" required placeholder="Ask the AI..."></textarea>
    <button id="submit" type="submit">Submit</button>
  </form>
  <p id="loading" hidden>Processing request...</p>
  <p id="error" role="alert"></p>
  <section id="result" hidden>
    <h2>AI response</h2><p id="response"></p>
    <h2>Routing</h2>
    <dl>
      <dt>Complexity</dt><dd id="complexity"></dd>
      <dt>Selected model</dt><dd id="model"></dd>
      <dt>Reason</dt><dd id="reason"></dd>
      <dt>Token usage</dt><dd id="usage">Not available</dd>
      <dt>Cost</dt><dd id="cost">Not available</dd>
    </dl>
  </section>
  <script>
    const form=document.querySelector("#form"), result=document.querySelector("#result");
    const prompt=document.querySelector("#prompt"), submit=document.querySelector("#submit");
    const loading=document.querySelector("#loading"), error=document.querySelector("#error");
    const response=document.querySelector("#response"), complexity=document.querySelector("#complexity");
    const model=document.querySelector("#model"), reason=document.querySelector("#reason");
    const usage=document.querySelector("#usage"), cost=document.querySelector("#cost");
    form.addEventListener("submit", async event => {
      event.preventDefault(); result.hidden=true; error.textContent="";
      loading.hidden=false; submit.disabled=true;
      try {
        const res=await fetch("/api/v1/ai/requests",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({prompt:prompt.value})});
        const data=await res.json();
        if(!res.ok) throw new Error(data.error?.message || data.detail?.[0]?.msg || "Request failed.");
        response.textContent=data.response;
        complexity.textContent=data.routing.complexity;
        model.textContent=`${data.routing.display_name} (${data.routing.provider_model_id})`;
        reason.textContent=data.routing.reason;
        usage.textContent=data.usage ? JSON.stringify(data.usage) : "Not available";
        cost.textContent=data.cost ? JSON.stringify(data.cost) : "Not available";
        result.hidden=false;
      } catch(e) { error.textContent=e.message; }
      finally { loading.hidden=true; submit.disabled=false; }
    });
  </script>
</body>
</html>
