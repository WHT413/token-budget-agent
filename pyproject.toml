[project]
name = 'token-budget-agent'
version = '0.1.0'
requires-python = '>=3.11'
dependencies = [
  "langgraph>=0.2",
  "langchain-anthropic>=0.2",
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "streamlit>=1.40",
  "python-dotenv>=1.0",
  "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = 'auto'
