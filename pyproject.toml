[project]
name = 'token-budget-agent'
version = '0.1.0'
requires-python = '>=3.11'
dependencies = [
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  "openai>=1.50",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "rich>=13.0",
  "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = 'auto'
